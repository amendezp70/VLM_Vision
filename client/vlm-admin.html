<!-- client/vlm-admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLM Vision — Admin Dashboard</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="vlm-admin.css">
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // ── Config ────────────────────────────────────────────────────────
    const API_BASE = window.location.origin + "/server/vlm_vision_function";

    // ── API helpers ───────────────────────────────────────────────────
    async function fetchJSON(path) {
      const res = await fetch(API_BASE + path);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    // ── Tab components ────────────────────────────────────────────────

    // ── Traceability Search ───────────────────────────────────────────
    function StatusBadge({ status }) {
      const map = {
        match:    "bg-green-900 text-green-300",
        mismatch: "bg-red-900 text-red-300",
        partial:  "bg-yellow-900 text-yellow-300",
      };
      const label = { match: "MATCH", mismatch: "MISMATCH", partial: "PARTIAL" }[status] || status;
      return <span className={`px-2 py-0.5 rounded text-xs font-semibold ${map[status] || "bg-gray-700"}`}>{label}</span>;
    }

    const SAMPLE_EVENTS = [
      { event_id: "EVT-1", event_timestamp: 1781030000, zone_id: 2, box_id: "BOX-4416",
        barcode_camera: "0687456223537", barcode_scanner: "0687456223537",
        match_status: "match", verified: 1, clips: [] },
      { event_id: "EVT-2", event_timestamp: 1781031820, zone_id: 2, box_id: "BOX-4417",
        barcode_camera: "0687456223537", barcode_scanner: "0687456999999",
        match_status: "mismatch", verified: 0,
        clips: [{ clip_id: "CLIP-2", cloud_url: "https://api.catalyst.zoho.com/baas/v1/project/35344000000152001/folder/35344000000205535/file/35344000000223003" }] },
      { event_id: "EVT-3", event_timestamp: 1781033140, zone_id: 2, box_id: "BOX-4420",
        barcode_camera: "1902birch44021", barcode_scanner: "1902birch44021",
        match_status: "match", verified: 1, clips: [] },
    ];

    function searchSampleData(barcode) {
      const q = barcode.trim();
      return SAMPLE_EVENTS
        .filter(e => e.barcode_camera === q || e.barcode_scanner === q)
        .sort((a, b) => b.event_timestamp - a.event_timestamp);
    }

    function TraceabilitySearch() {
      const [query, setQuery] = useState("");
      const [results, setResults] = useState(null);
      const [loading, setLoading] = useState(false);

      const runSearch = useCallback(async () => {
        const barcode = query.trim();
        if (!barcode) return;
        setLoading(true);
        try {
          const events = searchSampleData(barcode);
          // LIVE: when the cloud endpoint exists, delete the line above and uncomment:
          // const data = await fetchJSON("/traceability/search?barcode=" + encodeURIComponent(barcode));
          // const events = data.events || [];
          setResults(events);
        } catch (e) {
          console.error("Search failed", e);
          setResults([]);
        }
        setLoading(false);
      }, [query]);

      const onKey = (e) => { if (e.key === "Enter") runSearch(); };

      return (
        <div>
          <h2 className="text-lg font-semibold mb-1">Traceability Search</h2>
          <p className="text-sm text-gray-500 mb-4">
            Look up a shipment by its barcode to see what happened and watch the evidence clip.
          </p>
          <div className="flex items-center gap-2 mb-6">
            <input
              value={query}
              onChange={e => setQuery(e.target.value)}
              onKeyDown={onKey}
              placeholder="Enter a barcode, e.g. 0687456223537"
              className="flex-1 max-w-md bg-gray-800 border border-gray-700 rounded px-3 py-2 text-sm font-mono placeholder-gray-600 focus:outline-none focus:border-blue-500"
            />
            <button onClick={runSearch}
              className="px-4 py-2 text-sm font-medium rounded bg-blue-600 hover:bg-blue-500 text-white">
              Search
            </button>
          </div>
          {loading && <p className="text-gray-500">Searching…</p>}
          {!loading && results !== null && results.length > 0 && (
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="border-b border-gray-800 text-gray-400 text-left">
                    <th className="py-2 px-3">Time</th>
                    <th className="py-2 px-3">Zone</th>
                    <th className="py-2 px-3">Box</th>
                    <th className="py-2 px-3">Camera read</th>
                    <th className="py-2 px-3">Scanner read</th>
                    <th className="py-2 px-3">Result</th>
                    <th className="py-2 px-3">Evidence</th>
                  </tr>
                </thead>
                <tbody>
                  {results.map((e) => (
                    <tr key={e.event_id} className="border-b border-gray-900 hover:bg-gray-900/50">
                      <td className="py-2 px-3 text-gray-400 whitespace-nowrap">{new Date(e.event_timestamp * 1000).toLocaleString()}</td>
                      <td className="py-2 px-3">{e.zone_id}</td>
                      <td className="py-2 px-3 font-mono">{e.box_id || "—"}</td>
                      <td className="py-2 px-3 font-mono">{e.barcode_camera || "—"}</td>
                      <td className="py-2 px-3 font-mono">{e.barcode_scanner || "—"}</td>
                      <td className="py-2 px-3"><StatusBadge status={e.match_status} /></td>
                      <td className="py-2 px-3">
                        {e.clips && e.clips.length > 0 ? (
                          <a href={e.clips[0].cloud_url || "#"} target="_blank" rel="noreferrer" className="text-blue-400 hover:text-blue-300">View clip ▸</a>
                        ) : (
                          <span className="text-gray-600">No clip</span>
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          {!loading && results !== null && results.length === 0 && (
            <p className="text-gray-600 text-center py-10">No events found for that barcode. Check the number and try again.</p>
          )}
          {!loading && results === null && (
            <p className="text-gray-700 text-center py-10">Enter a barcode above to search. Try <span className="font-mono text-gray-500">0687456223537</span>.</p>
          )}
        </div>
      );
    }

    // ── Video Archive ─────────────────────────────────────────────────
    const ZONE_NAMES = { 1: "Packing", 2: "Barcode Scan", 3: "Sealing", 4: "Pallet", 5: "Truck" };
    const archiveCloudRef = (id) =>
      "https://api.catalyst.zoho.com/baas/v1/project/35344000000152001/folder/35344000000205535/file/" + id;

    const SAMPLE_ARCHIVE = [
      { event_id: "EVT-10", event_timestamp: 1781035400, zone_id: 2, box_id: "BOX-4431",
        barcode_camera: "0687456771201", barcode_scanner: "0687456771201", match_status: "match", clips: [] },
      { event_id: "EVT-09", event_timestamp: 1781035100, zone_id: 4, box_id: "BOX-4430",
        barcode_camera: "0687456771188", barcode_scanner: "0687456000000", match_status: "mismatch",
        clips: [{ cloud_url: archiveCloudRef("35344000000223101") }] },
      { event_id: "EVT-08", event_timestamp: 1781034700, zone_id: 3, box_id: "BOX-4429",
        barcode_camera: "0687456770042", barcode_scanner: "", match_status: "partial",
        clips: [{ cloud_url: archiveCloudRef("35344000000223097") }] },
      { event_id: "EVT-07", event_timestamp: 1781034200, zone_id: 2, box_id: "BOX-4428",
        barcode_camera: "0687456223537", barcode_scanner: "0687456223537", match_status: "match", clips: [] },
      { event_id: "EVT-06", event_timestamp: 1781033800, zone_id: 5, box_id: "BOX-4427",
        barcode_camera: "0687456769910", barcode_scanner: "0687456769911", match_status: "mismatch",
        clips: [{ cloud_url: archiveCloudRef("35344000000223080") }] },
      { event_id: "EVT-05", event_timestamp: 1781033140, zone_id: 4, box_id: "BOX-4420",
        barcode_camera: "1902birch44021", barcode_scanner: "1902birch44021", match_status: "match", clips: [] },
      { event_id: "EVT-04", event_timestamp: 1781032600, zone_id: 3, box_id: "BOX-4419",
        barcode_camera: "0687456768833", barcode_scanner: "0687456768833", match_status: "match", clips: [] },
      { event_id: "EVT-03", event_timestamp: 1781031820, zone_id: 2, box_id: "BOX-4417",
        barcode_camera: "0687456223537", barcode_scanner: "0687456999999", match_status: "mismatch",
        clips: [{ cloud_url: archiveCloudRef("35344000000223003") }] },
    ];

    function VideoArchive() {
      const [resultFilter, setResultFilter] = useState("");
      const [zoneFilter, setZoneFilter] = useState("");

      const rows = SAMPLE_ARCHIVE
        .filter(e => !resultFilter || e.match_status === resultFilter)
        .filter(e => !zoneFilter || String(e.zone_id) === zoneFilter)
        .sort((a, b) => b.event_timestamp - a.event_timestamp);
      // LIVE: replace SAMPLE_ARCHIVE with state loaded from
      //   fetchJSON("/traceability/recent?limit=100") in a useEffect.

      const selectCls = "bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm";

      return (
        <div>
          <div className="flex flex-wrap items-center gap-3 mb-5">
            <h2 className="text-lg font-semibold">Video Archive</h2>
            <span className="text-sm text-gray-500">Recent events across all zones</span>
            <div className="flex-1"></div>
            <select value={resultFilter} onChange={e => setResultFilter(e.target.value)} className={selectCls}>
              <option value="">All results</option>
              <option value="mismatch">Mismatches</option>
              <option value="match">Matches</option>
              <option value="partial">Partial</option>
            </select>
            <select value={zoneFilter} onChange={e => setZoneFilter(e.target.value)} className={selectCls}>
              <option value="">All zones</option>
              <option value="1">Zone 1 — Packing</option>
              <option value="2">Zone 2 — Barcode Scan</option>
              <option value="3">Zone 3 — Sealing</option>
              <option value="4">Zone 4 — Pallet</option>
              <option value="5">Zone 5 — Truck</option>
            </select>
          </div>

          <div className="text-xs text-gray-600 mb-2">{rows.length} event{rows.length === 1 ? "" : "s"}</div>

          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="border-b border-gray-800 text-gray-400 text-left">
                  <th className="py-2 px-3">Time</th>
                  <th className="py-2 px-3">Zone</th>
                  <th className="py-2 px-3">Box</th>
                  <th className="py-2 px-3">Camera read</th>
                  <th className="py-2 px-3">Scanner read</th>
                  <th className="py-2 px-3">Result</th>
                  <th className="py-2 px-3">Evidence</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((e) => (
                  <tr key={e.event_id} className="border-b border-gray-900 hover:bg-gray-900/50">
                    <td className="py-2 px-3 text-gray-400 whitespace-nowrap">{new Date(e.event_timestamp * 1000).toLocaleString()}</td>
                    <td className="py-2 px-3 whitespace-nowrap">
                      <span className="text-gray-300">{e.zone_id}</span>
                      <span className="text-gray-600"> · {ZONE_NAMES[e.zone_id] || "?"}</span>
                    </td>
                    <td className="py-2 px-3 font-mono">{e.box_id || "—"}</td>
                    <td className="py-2 px-3 font-mono">{e.barcode_camera || "—"}</td>
                    <td className="py-2 px-3 font-mono">{e.barcode_scanner || "—"}</td>
                    <td className="py-2 px-3"><StatusBadge status={e.match_status} /></td>
                    <td className="py-2 px-3">
                      {e.clips && e.clips.length > 0 ? (
                        <a href={e.clips[0].cloud_url || "#"} target="_blank" rel="noreferrer" className="text-blue-400 hover:text-blue-300">View clip ▸</a>
                      ) : (
                        <span className="text-gray-600">No clip</span>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            {rows.length === 0 && (
              <p className="text-gray-600 text-center py-10">No events match these filters.</p>
            )}
          </div>
        </div>
      );
    }

    function PickHistory() {
      const [events, setEvents] = useState([]);
      const [filter, setFilter] = useState("");
      const [loading, setLoading] = useState(true);

      const load = useCallback(async () => {
        setLoading(true);
        try {
          const params = filter ? `?limit=100&result=${filter}` : "?limit=100";
          const data = await fetchJSON("/picks/history" + params);
          setEvents(data.events || []);
        } catch (e) {
          console.error("Failed to load picks", e);
        }
        setLoading(false);
      }, [filter]);

      useEffect(() => { load(); }, [load]);

      const resultBadge = (r) => {
        const colors = { correct: "bg-green-900 text-green-300", wrong: "bg-red-900 text-red-300", short: "bg-yellow-900 text-yellow-300" };
        return <span className={`px-2 py-0.5 rounded text-xs font-medium ${colors[r] || "bg-gray-700"}`}>{r}</span>;
      };

      return (
        <div>
          <div className="flex items-center gap-3 mb-4">
            <h2 className="text-lg font-semibold">Pick History</h2>
            <select value={filter} onChange={e => setFilter(e.target.value)}
              className="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm">
              <option value="">All results</option>
              <option value="correct">Correct</option>
              <option value="wrong">Wrong</option>
              <option value="short">Short</option>
            </select>
            <button onClick={load} className="text-sm text-blue-400 hover:text-blue-300">Refresh</button>
          </div>
          {loading ? <p className="text-gray-500">Loading...</p> : (
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr className="border-b border-gray-800 text-gray-400 text-left">
                    <th className="py-2 px-3">Order</th>
                    <th className="py-2 px-3">SKU</th>
                    <th className="py-2 px-3">Qty</th>
                    <th className="py-2 px-3">Bay</th>
                    <th className="py-2 px-3">Worker</th>
                    <th className="py-2 px-3">Result</th>
                    <th className="py-2 px-3">Time</th>
                  </tr>
                </thead>
                <tbody>
                  {events.map((e, i) => (
                    <tr key={i} className="border-b border-gray-900 hover:bg-gray-900/50">
                      <td className="py-2 px-3 font-mono">{e.order_id}</td>
                      <td className="py-2 px-3">{e.sku}</td>
                      <td className="py-2 px-3">{e.qty_picked}</td>
                      <td className="py-2 px-3">{e.bay_id}</td>
                      <td className="py-2 px-3">{e.worker_id}</td>
                      <td className="py-2 px-3">{resultBadge(e.result)}</td>
                      <td className="py-2 px-3 text-gray-500">{new Date(e.timestamp * 1000).toLocaleString()}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              {events.length === 0 && <p className="text-gray-600 text-center py-8">No pick events found</p>}
            </div>
          )}
        </div>
      );
    }

    function StatsCards() {
      const [stats, setStats] = useState(null);

      useEffect(() => {
        fetchJSON("/picks/stats").then(setStats).catch(() => setStats(null));
      }, []);

      if (!stats) return <p className="text-gray-500">Loading stats...</p>;

      const cards = [
        { label: "Total Picks", value: stats.total || 0, color: "blue" },
        { label: "Correct", value: stats.correct || 0, color: "green" },
        { label: "Wrong", value: stats.wrong || 0, color: "red" },
        { label: "Short", value: stats.short || 0, color: "yellow" },
      ];

      return (
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
          {cards.map(c => (
            <div key={c.label} className={`bg-gray-900 border border-gray-800 rounded-lg p-4`}>
              <div className="text-gray-400 text-xs uppercase tracking-wide">{c.label}</div>
              <div className={`text-2xl font-bold mt-1 text-${c.color}-400`}>{c.value}</div>
            </div>
          ))}
        </div>
      );
    }

    function ModelInfo() {
      const [model, setModel] = useState(null);
      const [error, setError] = useState(null);

      useEffect(() => {
        fetchJSON("/models/latest")
          .then(setModel)
          .catch(() => setError("Could not fetch model info"));
      }, []);

      return (
        <div>
          <h2 className="text-lg font-semibold mb-4">Model Registry</h2>
          {error && <p className="text-red-400">{error}</p>}
          {model && (
            <div className="bg-gray-900 border border-gray-800 rounded-lg p-4 max-w-md">
              <div className="flex justify-between items-center">
                <span className="text-gray-400">Current Version</span>
                <span className="text-green-400 font-mono font-bold">{model.version}</span>
              </div>
              <div className="mt-2 text-xs text-gray-600 break-all">{model.url}</div>
            </div>
          )}
        </div>
      );
    }

    // ── App ────────────────────────────────────────────────────────────
    function App() {
      const [tab, setTab] = useState("history");

      const tabs = [
        { id: "history", label: "Pick History" },
        { id: "stats", label: "Statistics" },
        { id: "model", label: "Model" },
        { id: "trace", label: "Traceability" },
        { id: "archive", label: "Video Archive" },
      ];

      return (
        <div className="max-w-6xl mx-auto px-4 py-6">
          {/* Header */}
          <div className="flex items-center justify-between mb-6">
            <div>
              <h1 className="text-xl font-bold text-white">VLM Vision Admin</h1>
              <p className="text-sm text-gray-500">Metwall Pick Verification System</p>
            </div>
            <div className="flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
              <span className="text-xs text-gray-400">System Online</span>
            </div>
          </div>

          {/* Tab nav */}
          <div className="flex gap-1 mb-6 border-b border-gray-800">
            {tabs.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)}
                className={`px-4 py-2 text-sm font-medium rounded-t transition-colors ${
                  tab === t.id
                    ? "bg-gray-800 text-white border-b-2 border-blue-500"
                    : "text-gray-500 hover:text-gray-300"
                }`}>
                {t.label}
              </button>
            ))}
          </div>

          {/* Tab content */}
          <div className="bg-gray-900/50 border border-gray-800 rounded-lg p-6">
            {tab === "history" && <PickHistory />}
            {tab === "stats" && (
              <div>
                <h2 className="text-lg font-semibold mb-4">Pick Statistics</h2>
                <StatsCards />
              </div>
            )}
            {tab === "model" && <ModelInfo />}
            {tab === "trace" && <TraceabilitySearch />}
            {tab === "archive" && <VideoArchive />}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
